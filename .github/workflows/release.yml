name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package DMG
        run: |
          mkdir -p /tmp/dmg
          cp -R build/macos/Build/Products/Release/dji_live_gallery.app /tmp/dmg/
          ln -s /Applications /tmp/dmg/Applications
          hdiutil create -volname "Pocket Motion" -srcfolder /tmp/dmg -ov -format UDZO PocketMotion-macOS.dmg
      - uses: softprops/action-gh-release@v2
        with:
          files: PocketMotion-macOS.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath PocketMotion-windows.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: PocketMotion-windows.zip
