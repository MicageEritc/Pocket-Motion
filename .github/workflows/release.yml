name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Install and bundle ffmpeg + exiftool
        run: |
          brew install ffmpeg exiftool
          RES="build/macos/Build/Products/Release/Pocket Motion.app/Contents/Resources"
          mkdir -p "$RES/bin"
          cp "$(which ffmpeg)" "$RES/bin/ffmpeg"
          chmod +x "$RES/bin/ffmpeg"
          EXIFTOOL_LIB=$(dirname $(dirname $(readlink -f $(which exiftool))))/libexec
          cp -R "$EXIFTOOL_LIB" "$RES/exiftool_lib"
          chmod +x "$RES/exiftool_lib/bin/exiftool"
      - name: Package DMG
        run: |
          mkdir -p /tmp/dmg
          cp -R "build/macos/Build/Products/Release/Pocket Motion.app" /tmp/dmg/
          ln -s /Applications /tmp/dmg/Applications
          hdiutil create -volname "Pocket Motion" -srcfolder /tmp/dmg -ov -format UDZO PocketMotion-macOS.dmg
      - uses: softprops/action-gh-release@v2
        with:
          files: PocketMotion-macOS.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Bundle VC++ Runtime DLLs
        shell: pwsh
        run: |
          $release = "build/windows/x64/runner/Release"
          foreach ($dll in @("vcruntime140.dll","vcruntime140_1.dll","msvcp140.dll")) {
            Copy-Item "C:\Windows\System32\$dll" $release
          }
      - name: Install and bundle ffmpeg + exiftool
        shell: pwsh
        run: |
          choco install ffmpeg exiftool -y --no-progress
          $release = "build/windows/x64/runner/Release"
          Copy-Item (Get-Command ffmpeg).Source $release
          Copy-Item (Get-Command exiftool).Source $release
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath PocketMotion-windows.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: PocketMotion-windows.zip
