name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Bundle ffmpeg and exiftool
        run: |
          RES="build/macos/Build/Products/Release/Pocket Motion.app/Contents/Resources"
          mkdir -p "$RES/bin"
          # ffmpeg 静态版
          curl -L -o /tmp/ffmpeg.zip "https://evermeet.cx/ffmpeg/getrelease/zip"
          unzip -o /tmp/ffmpeg.zip -d /tmp/ffmpeg_bin
          cp /tmp/ffmpeg_bin/ffmpeg "$RES/bin/ffmpeg"
          chmod +x "$RES/bin/ffmpeg"
          # exiftool
          curl -L -o /tmp/exiftool.tar.gz "https://exiftool.org/Image-ExifTool-13.40.tar.gz"
          tar -xzf /tmp/exiftool.tar.gz -C /tmp/
          cp -R /tmp/Image-ExifTool-13.40 "$RES/exiftool_lib"
          chmod +x "$RES/exiftool_lib/exiftool"
      - name: Package DMG
        run: |
          mkdir -p /tmp/dmg
          cp -R "build/macos/Build/Products/Release/Pocket Motion.app" /tmp/dmg/
          ln -s /Applications /tmp/dmg/Applications
          hdiutil create -volname "Pocket Motion" -srcfolder /tmp/dmg -ov -format UDZO PocketMotion-macOS.dmg
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PocketMotion-macOS.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Bundle VC++ Runtime DLLs
        shell: pwsh
        run: |
          $release = "build/windows/x64/runner/Release"
          $dlls = @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")
          foreach ($dll in $dlls) {
            $src = "C:\Windows\System32\$dll"
            if (Test-Path $src) { Copy-Item $src $release }
          }
      - name: Download ffmpeg and exiftool
        shell: pwsh
        run: |
          $release = "build/windows/x64/runner/Release"
          # ffmpeg
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          Copy-Item "ffmpeg_tmp/ffmpeg-*/bin/ffmpeg.exe" $release
          # exiftool - 用更稳定的下载地址
          Invoke-WebRequest -Uri "https://exiftool.org/exiftool-13.40_64.zip" -OutFile exiftool.zip
          Expand-Archive exiftool.zip -DestinationPath exiftool_tmp
          Get-ChildItem exiftool_tmp -Recurse -Filter "exiftool*.exe" | Copy-Item -Destination "$release/exiftool.exe"
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath PocketMotion-windows.zip
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PocketMotion-windows.zip
