name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Install and bundle ffmpeg + exiftool
        run: |
          brew install ffmpeg exiftool
          RES="build/macos/Build/Products/Release/Pocket Motion.app/Contents/Resources"
          mkdir -p "$RES/bin"
          cp "$(which ffmpeg)" "$RES/bin/ffmpeg"
          chmod +x "$RES/bin/ffmpeg"
          EXIFTOOL_LIB=$(dirname $(dirname $(readlink -f $(which exiftool))))/libexec
          cp -R "$EXIFTOOL_LIB" "$RES/exiftool_lib"
          chmod +x "$RES/exiftool_lib/bin/exiftool"
      - name: Package DMG
        run: |
          mkdir -p /tmp/dmg
          cp -R "build/macos/Build/Products/Release/Pocket Motion.app" /tmp/dmg/
          ln -s /Applications /tmp/dmg/Applications
          hdiutil create -volname "Pocket Motion" -srcfolder /tmp/dmg -ov -format UDZO PocketMotion-macOS.dmg
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: PocketMotion-macOS.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Bundle VC++ Runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = "build/windows/x64/runner/Release"
          foreach ($dll in @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")) {
            $src = "C:\Windows\System32\$dll"
            if (Test-Path -LiteralPath $src) {
              Copy-Item -LiteralPath $src -Destination $release -Force
            }
          }
      - name: Bundle ffmpeg and exiftool
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $release = "build/windows/x64/runner/Release"

          # 1. 下载并解压 ffmpeg (BtbN 静态构建)
          curl.exe -fL --retry 3 "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -o ffmpeg.zip
          Expand-Archive -LiteralPath ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          $ffExe = Get-ChildItem ffmpeg_tmp -Recurse -File -Filter "ffmpeg.exe" | Select-Object -First 1
          if (-not $ffExe) { throw "ffmpeg.exe not found in archive" }
          Copy-Item -LiteralPath $ffExe.FullName -Destination "$release/ffmpeg.exe" -Force

          # 2. 下载并解压 exiftool（压缩包内含顶层目录 exiftool-x.xx_64/，包含 exiftool(-k).exe 与依赖目录 exiftool_files/）
          $exifDownloaded = $false
          $urls = @(
            "https://downloads.sourceforge.net/project/exiftool/exiftool-13.59_64.zip",
            "https://oliverbetz.de/cms/files/Artikel/ExifTool-for-Windows/exiftool-13.59_64.zip"
          )
          foreach ($u in $urls) {
            try {
              curl.exe -fL --retry 3 -A "Mozilla/5.0" $u -o exiftool.zip
              if ((Test-Path exiftool.zip) -and ((Get-Item exiftool.zip).Length -gt 1000000)) {
                Expand-Archive -LiteralPath exiftool.zip -DestinationPath exiftool_tmp -Force
                $exifDownloaded = $true
                break
              }
            } catch {
              Write-Host "Download from $u failed, trying next..."
            }
          }

          if (-not $exifDownloaded) {
            choco install exiftool -y --no-progress
            $chocoRoot = "C:\ProgramData\chocolatey\lib\exiftool\tools"
            $exifExe = Get-ChildItem $chocoRoot -Recurse -File | Where-Object { $_.Name -like "exiftool*.exe" } | Select-Object -First 1
          } else {
            $exifExe = Get-ChildItem exiftool_tmp -Recurse -File | Where-Object { $_.Name -like "exiftool*.exe" } | Select-Object -First 1
          }

          if (-not $exifExe) { throw "exiftool executable not found" }
          Copy-Item -LiteralPath $exifExe.FullName -Destination "$release/exiftool.exe" -Force
          $exifFiles = Join-Path $exifExe.DirectoryName "exiftool_files"
          if (Test-Path -LiteralPath $exifFiles) {
            Copy-Item -LiteralPath $exifFiles -Destination "$release/exiftool_files" -Recurse -Force
          }

          # 验证打包后的工具可直接运行
          & "$release/ffmpeg.exe" -version | Select-Object -First 1
          & "$release/exiftool.exe" -ver
      - name: Zip
        shell: pwsh
        run: |
          7z a -tzip PocketMotion-windows.zip ./build/windows/x64/runner/Release/*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: PocketMotion-windows.zip
